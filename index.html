<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pendu</title>

    <!-- Lien vers Bootstrap -->
    <link
      rel="stylesheet"
      href="node_modules/bootstrap/dist/css/bootstrap.min.css"
    />

    <!-- Lien vers les icônes Bootstrap -->
    <!-- <link rel="stylesheet" href="/node_modules/bootstrap-icons/font/bootstrap-icons.min.css"> -->

    <!-- Lien pour utiliser JavaScript pour les actions de l'utilisateur -->

        <p class="text-center fs-1" id="partiePerdueOuGagnee"></p>
        <div class="text-center m-5">
          <button id="btnA" onclick="utiliserLettre('a')">a</button>
          <button id="btnB" onclick="utiliserLettre('b')">b</button>

          <button id="btnL" onclick="utiliserLettre('l')">l</button>

          <button id="btnO" onclick="utiliserLettre('o')">o</button>
          <button id="btnP" onclick="utiliserLettre('p')">p</button>
          <button id="btnQ" onclick="utiliserLettre('q')">q</button>
          <button id="btnR" onclick="utiliserLettre('r')">r</button>
          <button id="btnS" onclick="utiliserLettre('s')">s</button>
          <button id="btnT" onclick="utiliserLettre('t')">t</button>
          <button id="btnU" onclick="utiliserLettre('u')">u</button>
          <button id="btnV" onclick="utiliserLettre('v')">v</button>
          <button id="btnW" onclick="utiliserLettre('w')">w</button>
          <button id="btnX" onclick="utiliserLettre('x')">x</button>
          <button id="btnY" onclick="utiliserLettre('y')">y</button>
          <button id="btnZ" onclick="utiliserLettre('z')">z</button>
        </div>
      </div>
    </main>

    <script src="js/script.js"></script>
